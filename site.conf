<Directory "/var/www/html/code.iamcal.com/www">
	Options -Indexes
	AllowOverride All

	php_flag display_errors on
	php_value error_reporting 2039
	php_value magic_quotes_gpc 0
	php_value register_globals 0
	php_value magic_quotes_runtime 0
	php_value register_long_arrays on

	DirectoryIndex index.php index.htm

	Order allow,deny
	Allow from all
</Directory>

<VirtualHost *:80>
	ServerName code.iamcal.com
	DocumentRoot /var/www/html/code.iamcal.com/www

	Redirect permanent / https://code.iamcal.com/
</VirtualHost>

Include /var/www/html/code.iamcal.com/ssl.conf

# amp.iamcal.com was Cal Amp's: everything there goes to its page here (it was a redirect in
# static-sites until 2026). The cert covers both names.
<VirtualHost *:80>
	ServerName amp.iamcal.com
	RedirectMatch permanent ^ https://code.iamcal.com/c/cal_amp/
</VirtualHost>
